<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Mockup — E-sports Broadcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0e17;
    --panel: rgba(255,255,255,.045);
    --stroke: rgba(255,255,255,.09);
    --text: #eef2ff;
    --muted: #8b93b0;
    --accent: #6366f1;
    --cyan: #22d3ee;
    --gold: #fbbf24;
    --silver: #cbd5e1;
    --bronze: #d97706;
    --green: #34d399;
    --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(60vw 60vh at 15% -10%, rgba(99,102,241,.22), transparent 60%),
      radial-gradient(50vw 50vh at 90% 110%, rgba(34,211,238,.14), transparent 60%),
      var(--bg);
    overflow: hidden;
  }
  body::before { /* fine grid */
    content: '';
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 85%);
  }

  .kiosk { position: relative; min-height: 100vh; display: flex; flex-direction: column; padding: 3.5vh 5vw; }

  .hdr { display: flex; align-items: center; justify-content: space-between; }
  .hdr-left { display: flex; align-items: center; gap: 1rem; }
  .logo-dot { width: 14px; height: 14px; border-radius: 4px; background: linear-gradient(135deg, var(--accent), var(--cyan)); }
  .hdr-title { font-size: clamp(1.2rem, 2.2vw, 1.8rem); font-weight: 700; letter-spacing: .28em; text-transform: uppercase; }
  .live {
    display: flex; align-items: center; gap: .5em;
    font-size: .9rem; letter-spacing: .2em; color: var(--muted); text-transform: uppercase;
  }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 12px var(--red); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  .board-name { color: var(--muted); font-size: clamp(1rem, 1.8vw, 1.4rem); margin-top: .4rem; letter-spacing: .08em; }
  .board-name b { color: var(--cyan); font-weight: 500; }

  /* --- Podium --- */
  .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 1.4vw; padding: 3vh 10vw 0; }
  .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 18px;
    padding: 2.2vh 1.4vw;
    text-align: center;
    backdrop-filter: blur(8px);
    animation: rise .8s cubic-bezier(.2,.9,.25,1.2) backwards;
  }
  .card:nth-child(1) { animation-delay: .15s; }
  .card:nth-child(2) { animation-delay: 0s; }
  .card:nth-child(3) { animation-delay: .3s; }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.94); } }

  .card.first {
    padding-top: 3.2vh;
    border-color: rgba(251,191,36,.55);
    background: linear-gradient(180deg, rgba(251,191,36,.1), var(--panel) 60%);
    box-shadow: 0 0 45px rgba(251,191,36,.18), 0 24px 50px -20px rgba(0,0,0,.7);
  }
  .card.first::before {
    content: '';
    position: absolute; inset: -1px; border-radius: 18px; padding: 1px;
    background: linear-gradient(120deg, transparent 30%, rgba(251,191,36,.9) 50%, transparent 70%);
    background-size: 250% 250%;
    -webkit-mask: linear-gradient(black, black) content-box, linear-gradient(black, black);
    mask: linear-gradient(black, black) content-box, linear-gradient(black, black);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: shine 3s linear infinite;
  }
  @keyframes shine { from { background-position: 200% 0; } to { background-position: -100% 0; } }

  .medal { width: 2.6em; height: 2.6em; margin: 0 auto .7em; border-radius: 50%; display: grid; place-items: center; font-size: clamp(1rem, 2vw, 1.6rem); font-weight: 700; color: #0b0e17; }
  .m1 { background: linear-gradient(145deg, #fde68a, var(--gold)); box-shadow: 0 0 25px rgba(251,191,36,.5); }
  .m2 { background: linear-gradient(145deg, #f1f5f9, var(--silver)); }
  .m3 { background: linear-gradient(145deg, #fbbf24, var(--bronze)); }
  .card .name { font-size: clamp(1.3rem, 2.6vw, 2.2rem); font-weight: 700; }
  .card .time { font-family: 'JetBrains Mono', monospace; font-size: clamp(1.1rem, 2.2vw, 1.8rem); color: var(--cyan); margin-top: .3em; }
  .card.first .time { color: var(--gold); }

  .chip-new {
    display: inline-block; font-size: .62em; letter-spacing: .15em; vertical-align: middle;
    color: #052e22; background: var(--green); border-radius: 999px; padding: .35em .9em; margin-left: .8em;
    font-weight: 700;
  }

  /* --- Rest of ranking --- */
  .table {
    flex: 1; margin: 3vh 10vw 0;
    background: var(--panel); border: 1px solid var(--stroke); border-radius: 18px;
    backdrop-filter: blur(8px);
    overflow: hidden;
  }
  .trow {
    display: grid; grid-template-columns: 4.5rem 1fr auto 7rem;
    align-items: center;
    padding: 1.5vh 2vw;
    font-size: clamp(1.1rem, 2vw, 1.7rem);
    border-bottom: 1px solid rgba(255,255,255,.05);
    animation: slideIn .6s ease backwards;
  }
  .trow:nth-child(1) { animation-delay: .45s; } .trow:nth-child(2) { animation-delay: .55s; }
  .trow:nth-child(3) { animation-delay: .65s; } .trow:nth-child(4) { animation-delay: .75s; }
  .trow:nth-child(5) { animation-delay: .85s; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-30px); } }
  .trow:last-child { border-bottom: 0; }
  .tpos { color: var(--muted); font-weight: 500; }
  .ttime { font-family: 'JetBrains Mono', monospace; text-align: right; }
  .delta { font-size: .72em; font-weight: 700; border-radius: 8px; padding: .25em .7em; }
  .d-up { color: var(--green); background: rgba(52,211,153,.12); }
  .d-down { color: var(--red); background: rgba(248,113,113,.12); }
  .d-eq { color: var(--muted); }

  .ftr { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .95rem; padding-top: 2vh; }
  .dots { display: flex; gap: .5em; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--stroke); }
  .dots i.on { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
</style>
</head>
<body>
<div class="kiosk">
  <header class="hdr">
    <div class="hdr-left">
      <span class="logo-dot"></span>
      <span class="hdr-title">Ranking</span>
    </div>
    <span class="live"><i></i>LIVE</span>
  </header>
  <p class="board-name">A11y Experience Center · <b>Screen-Reader Run</b></p>

  <section class="podium">
    <div class="card">
      <div class="medal m2">2</div>
      <div class="name">Diego F. <span class="chip-new">NEW</span></div>
      <div class="time">04:05</div>
    </div>
    <div class="card first">
      <div class="medal m1">1</div>
      <div class="name">Martina R.</div>
      <div class="time">03:41</div>
    </div>
    <div class="card">
      <div class="medal m3">3</div>
      <div class="name">Carla S.</div>
      <div class="time">04:19</div>
    </div>
  </section>

  <main class="table">
    <div class="trow"><span class="tpos">04</span><span>Juan P.</span><span class="delta d-eq">—</span><span class="ttime">04:52</span></div>
    <div class="trow"><span class="tpos">05</span><span>Luciana B.</span><span class="delta d-up">▲ 1</span><span class="ttime">05:07</span></div>
    <div class="trow"><span class="tpos">06</span><span>Andrés T. <span class="chip-new">NEW</span></span><span class="delta d-eq">—</span><span class="ttime">05:30</span></div>
    <div class="trow"><span class="tpos">07</span><span>Sofía L.</span><span class="delta d-down">▼ 2</span><span class="ttime">05:48</span></div>
    <div class="trow"><span class="tpos">08</span><span>Marco D.</span><span class="delta d-eq">—</span><span class="ttime">06:12</span></div>
  </main>

  <footer class="ftr">
    <span>Actualizado 21:34:07</span>
    <span class="dots"><i class="on"></i><i></i><i></i></span>
  </footer>
</div>
</body>
</html>
