# Deploys the combined site to Azure Static Web Apps:
#   apps/experience → /        (Faro + workshop session layer)
#   apps/kiosk      → /kiosko/ (ranking kiosk)
#
# Required GitHub secrets:
#   AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_GROUND_0CC6F5110 — auto-created by Azure when linking the repo
#   VITE_API_BASE_URL               — e.g. https://<func-app>.azurewebsites.net
#   VITE_EVENT_KEY                  — shared event key baked into the bundle

name: Deploy SWA (experience + kiosk)

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'shared/**'
      - '.github/workflows/swa-deploy.yml'
  workflow_dispatch:

env:
  VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
  VITE_EVENT_KEY: ${{ secrets.VITE_EVENT_KEY }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/experience/package-lock.json
            apps/kiosk/package-lock.json

      - name: Build experience app (root /)
        run: |
          npm --prefix apps/experience ci
          npm --prefix apps/experience run build

      - name: Build kiosk app (/kiosko/)
        run: |
          npm --prefix apps/kiosk ci
          npm --prefix apps/kiosk run build

      - name: Assemble combined site
        run: |
          mkdir -p output
          cp -r apps/experience/dist/* output/
          mkdir -p output/kiosko
          cp -r apps/kiosk/dist/* output/kiosko/

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_GROUND_0CC6F5110 }}
          action: upload
          app_location: output
          skip_app_build: true
